<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Preview - ResumeCraft AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="preview-body">

    <header class="preview-header">

        <h2>ResumeCraft <span>AI</span></h2>

        <div>
            <a href="resume-builder.html">← Edit Resume</a>
            <button onclick="downloadResume()">Download Resume PDF</button>
        </div>

    </header>


    <main class="preview-container">

        <div class="resume-paper">

            <div class="preview-personal">

                <h1 id="previewName">Your Name</h1>

                <h3 id="previewTitle">Professional Title</h3>

                <p id="previewContact"></p>

            </div>


            <section class="preview-section">
                <h2>CAREER OBJECTIVE</h2>
                <p id="previewObjective"></p>
            </section>


            <section class="preview-section">
                <h2>EDUCATION</h2>
                <h3 id="previewDegree"></h3>
                <p id="previewCollege"></p>
                <p id="previewYear"></p>
                <p id="previewGrade"></p>
            </section>


            <section class="preview-section">
                <h2>TECHNICAL SKILLS</h2>
                <p id="previewSkills"></p>
            </section>


            <section class="preview-section">
                <h2>PROJECTS</h2>
                <h3 id="previewProjectTitle"></h3>
                <p id="previewProjectDescription"></p>
            </section>


            <section class="preview-section">
                <h2>INTERNSHIP / EXPERIENCE</h2>
                <h3 id="previewCompany"></h3>
                <p id="previewRole"></p>
                <p id="previewExperience"></p>
            </section>


            <section class="preview-section">
                <h2>CERTIFICATIONS</h2>
                <p id="previewCertifications"></p>
            </section>


            <section class="preview-section">
                <h2>LANGUAGES</h2>
                <p id="previewLanguages"></p>
            </section>


            <section class="preview-section">
                <h2>HOBBIES</h2>
                <p id="previewHobbies"></p>
            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
