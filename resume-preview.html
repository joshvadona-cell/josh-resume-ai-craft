
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Preview - Josh Resume AI Craft</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="preview-body">

    <header class="builder-header">
        <h2>Josh Resume <span>AI Craft</span></h2>
        <a href="dashboard.html">← Dashboard</a>
    </header>

    <main class="preview-container">

        <div class="builder-heading">
            <h1>Your Professional Resume</h1>
            <p>Review your resume before downloading.</p>
        </div>

        <div class="preview-actions">
            <button onclick="window.print()" class="save-btn">
                Download Resume ↓
            </button>

            <button onclick="window.location.href='resume-builder.html'">
                Back to Edit
            </button>
        </div>

        <div class="resume-paper">

            <!-- PERSONAL INFORMATION -->
            <div class="preview-personal">

                <img
                    id="previewProfilePhoto"
                    src=""
                    alt="Profile Photo"
                    style="display:none; width:120px; height:120px; object-fit:cover; border-radius:50%; margin-bottom:15px;">

                <h1 id="previewName"></h1>

                <h3 id="previewTitle"></h3>

                <p id="previewContact"></p>

                <p id="previewLinks"></p>

            </div>


            <!-- CAREER OBJECTIVE -->
            <section class="preview-section" id="objectiveSection">

                <h2>CAREER OBJECTIVE</h2>

                <p id="previewObjective"></p>

            </section>


            <!-- EDUCATION -->
            <section class="preview-section" id="educationSection">

                <h2>EDUCATIONAL QUALIFICATION</h2>

                <p id="previewDegree"></p>

                <p id="previewCollege"></p>

                <p id="previewYear"></p>

                <p id="previewGrade"></p>

                <p id="previewSchool"></p>

                <p id="preview12th"></p>

                <p id="preview10th"></p>

            </section>


            <!-- TECHNICAL SKILLS -->
            <section class="preview-section" id="skillsSection">

                <h2>TECHNICAL SKILLS</h2>

                <p id="previewProgrammingSkills"></p>

                <p id="previewWebSkills"></p>

                <p id="previewDatabaseSkills"></p>

                <p id="previewAISkills"></p>

                <p id="previewSkills"></p>

            </section>


            <!-- WORK EXPERIENCE -->
            <section class="preview-section" id="experienceSection">

                <h2>WORK EXPERIENCE</h2>

                <p id="previewCompany"></p>

                <p id="previewRole"></p>

                <p id="previewWorkDuration"></p>

                <p id="previewExperience"></p>

            </section>


            <!-- INTERNSHIP -->
            <section class="preview-section" id="internshipSection">

                <h2>INTERNSHIP EXPERIENCE</h2>

                <p id="previewInternshipCompany"></p>

                <p id="previewInternshipRole"></p>

                <p id="previewInternshipDuration"></p>

                <p id="previewInternshipDescription"></p>

            </section>


            <!-- PROJECTS -->
            <section class="preview-section" id="projectsSection">

                <h2>PROJECTS</h2>

                <div id="previewProjects"></div>

            </section>


            <!-- CERTIFICATIONS -->
            <section class="preview-section" id="certificationsSection">

                <h2>CERTIFICATIONS</h2>

                <p id="previewCertifications"></p>

            </section>


            <!-- ACHIEVEMENTS -->
            <section class="preview-section" id="achievementsSection">

                <h2>ACHIEVEMENTS</h2>

                <p id="previewAchievements"></p>

            </section>


            <!-- LANGUAGES -->
            <section class="preview-section" id="languagesSection">

                <h2>LANGUAGES KNOWN</h2>

                <p id="previewLanguages"></p>

            </section>


            <!-- SOFT SKILLS -->
            <section class="preview-section" id="softSkillsSection">

                <h2>SOFT SKILLS</h2>

                <p id="previewSoftSkills"></p>

            </section>


            <!-- HOBBIES -->
            <section class="preview-section" id="hobbiesSection">

                <h2>HOBBIES & INTERESTS</h2>

                <p id="previewHobbies"></p>

            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
